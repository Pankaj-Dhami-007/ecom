server:
  port: 8090

spring:
  application:
    name: api-gateway

  security:
    oauth2:
      resourceserver:
        jwt:
          secret-key: VGhpc0lzTXlTdXBlclNlY3JldEtleUZvckpXVDEyMzQ1Njc4OTA=

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: ${AUTH_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/auth/api/v1/**

            - id: product-service
              uri: ${PRODUCT_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/v1/products/**,/api/v1/categories/**

            - id: order-service
              uri: ${ORDER_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/v1/orders/**

            - id: cart-service
              uri: ${CART_SERVICE_URL:http://localhost:8086}
              predicates:
                - Path=/api/v1/carts/**

logging:
  level:
    com.codemonks.api_gateway: DEBUG
    org.springframework.cloud.gateway: INFO
    org.springframework.security: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
