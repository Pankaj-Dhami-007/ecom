server:
  port: 8081

# database connections
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/ecom_auth_db
    username: root
    password: 123456

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
    show-sql: true

# security config

security:
  jwt:
    secret: VGhpc0lzTXlTdXBlclNlY3JldEtleUZvckpXVDEyMzQ1Njc4OTA=
    issuer: auth-service
    access-ttl-seconds: 604800
    refresh-ttl-seconds: 604800