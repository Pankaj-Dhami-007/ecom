server:
  port: 8084

spring:
  application:
    name: notification-service

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:pankajdhami811@gmail.com}
    password: rsmadbeitmnqrvcw

    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
        debug: true

  kafka:
    bootstrap-servers: ${KAFKA_URL:localhost:9092}
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        # Spring Boot 4 no longer has spring.json.* properties of its own, so this raw
        # Spring Kafka property has to be set on the consumer factory directly.
        spring.json.use.type.headers: false
      group-id: notification-service

notifications:
  recipient:
    email: ${NOTIFICATION_RECIPIENT_EMAIL:pankajdhami357@gmail.com}

logging:
  level:
    com.dhami.notificationservice: DEBUG
    org.springframework.mail: DEBUG
    jakarta.mail: DEBUG
    com.sun.mail: DEBUG
    org.springframework.web: INFO

  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"