server:
  port: 8090

# Local development: every service runs on this machine.
# These values feed the ${SERVICE_URL:...} placeholders used by the routes in
# application.yml, so routing only has to be declared in one place.
# A real environment variable (e.g. set in Docker) still wins over these.
AUTH_SERVICE_URL: http://localhost:8081
PRODUCT_SERVICE_URL: http://localhost:8082
ORDER_SERVICE_URL: http://localhost:8083
CART_SERVICE_URL: http://localhost:8086
