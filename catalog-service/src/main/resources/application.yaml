server:
  port: 8082

spring:
  application:
    name: catalog-service

  datasource:
    url: jdbc:mysql://localhost:3306/ecom_catalog_db
    username: root
    password: 123456

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
    show-sql: true
